[package]
name = "granit-ui"
version.workspace = true
license.workspace = true
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1.7"
web-sys = { version = "0.3.104", features = [
    "Window",
    "Element",
    "DomRect",
    "HtmlAnchorElement",
    "HtmlInputElement",
    "NodeList",
    "Node",
    "EventTarget",
    "DataTransfer",
    "DragEvent",
    "Navigator",
    "ScrollIntoViewOptions",
    "ScrollBehavior",
    "ScrollLogicalPosition",
] }
granit-types = { path = "granit-types" }
granit-api = { path = "granit-api" }
gloo-timers = { version = "0.4.0", features = ["futures"] }
serde_json = "1.0.151"
leptos_icons = "0.7.1"
icondata_lu = "0.1.0"
icondata_core = "0.1.0"
icondata_mdi = "0.1.0"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[workspace]
members = ["src-tauri", "granit-core", "granit-app", "granit-types", "granit-api", "backend"]

# zorite-editor with the stale-layout input fix (Bears baa.ac), from the fork
# branch behind packetThrower/zorite-editor#5. Drop this once a release
# carries the fix (Bears zem.vs).
[patch.crates-io]
zorite-editor = { git = "https://github.com/LHelge/zorite-editor", branch = "fix/stale-layout-input" }

[workspace.package]
version = "0.10.1"
license = "MIT OR Apache-2.0"
