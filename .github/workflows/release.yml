name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  # The changelog must exist before the build: tauri-action bakes the
  # release body into the updater manifest (latest.json "notes"), which is
  # what the app shows as release notes after an automatic update.
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      body: ${{ steps.changelog.outputs.body }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Generate changelog
        id: changelog
        run: |
          git-cliff --latest --strip header -o CHANGELOG_RELEASE.md
          {
            echo 'body<<CHANGELOG_EOF'
            cat CHANGELOG_RELEASE.md
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

  # Publish the backup backend as a container image. Runs alongside the
  # desktop builds (both gate on the same CI check) but is independent of
  # them: a failed image push must not hold back the desktop release and
  # vice versa. The Dockerfile expects the repository root as build
  # context because granit-server depends on the granit-api path crate.
  backend-image:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v0.8.0 -> 0.8.0, 0.8, latest
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/lhelge/granit-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No attestation manifest: it shows up as a confusing extra
          # "unknown/unknown" entry on the GHCR package page.
          provenance: false

  build:
    needs: [check, changelog]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: ubuntu-latest
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    # Typically 16-22 min (Windows slowest). macOS minutes bill at 10x on
    # private repos, so a hung build must not run to the 6 h default.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      # Bounded for the same reason as in ci.yml: an unreachable Ubuntu
      # mirror stalls apt for a long time instead of failing.
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # The linuxdeploy build tauri pins predates the excludelist entries for
      # libwayland, so the AppImage ships Ubuntu's libwayland-* and the host
      # EGL stack dlopens them, aborting with EGL_BAD_PARAMETER on rolling
      # distros (Arch/Hyprland reproduced). tauri-bundler only downloads
      # linuxdeploy-plugin-gtk.sh when it is absent from its tool cache, so we
      # pre-seed a patched copy that strips libwayland from the AppDir before
      # packaging and signing. Drop this once tauri updates its linuxdeploy.
      - name: Patch AppImage gtk plugin to exclude libwayland
        if: matrix.platform == 'ubuntu-latest'
        run: |
          mkdir -p ~/.cache/tauri
          curl -fsSL https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh -o ~/.cache/tauri/linuxdeploy-plugin-gtk.sh
          cat >> ~/.cache/tauri/linuxdeploy-plugin-gtk.sh <<'PATCH'

          # granit patch: never ship libwayland — bundled copies break host EGL
          # display creation (EGL_BAD_PARAMETER) on hosts newer than the runner.
          echo "granit patch: removing bundled libwayland from AppDir"
          rm -f "$APPDIR"/usr/lib/libwayland-*.so*
          PATCH
          chmod +x ~/.cache/tauri/linuxdeploy-plugin-gtk.sh

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,wasm32-unknown-unknown' || 'wasm32-unknown-unknown' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install trunk
        uses: taiki-e/install-action@trunk

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Import Apple Developer Certificate
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Verify certificate
        if: matrix.platform == 'macos-latest'
        run: |
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application")
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          echo "CERT_ID=$CERT_ID" >> $GITHUB_ENV
          echo "Certificate imported."

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && env.CERT_ID || '' }}
          APPLE_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Granit v__VERSION__'
          releaseBody: ${{ needs.changelog.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Un-draft the release; the body was already set from the changelog job.
  # The updater endpoint (releases/latest/download/latest.json) only
  # resolves for published releases, so this is what makes the update
  # visible to running apps.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ github.ref_name }}" --draft=false

  # Build the docs site into an nginx image and deploy it to hoster
  # (stack file: docs/docs.stack.toml). The docs follow the released app, so
  # they go out only once the GitHub release is published. Authenticated
  # with the job's OIDC token, no secret: the stack's [deploy] rule allows
  # this repository's v* tags from the `production` environment.
  docs:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://granit.lhelge.se
    permissions:
      contents: read
      packages: write   # push to ghcr with GITHUB_TOKEN
      id-token: write   # request an OIDC token for hoster
    env:
      DOCS_IMAGE: ghcr.io/lhelge/granit-docs
      DOCS_STACK: granit
      DOCS_SERVICE: docs
      DEPLOY_URL: https://hoster.lhelge.se/hooks/deploy
      DEPLOY_AUDIENCE: https://hoster.lhelge.se

    steps:
      - uses: actions/checkout@v6

      - name: Build docs with aphid
        uses: LHelge/aphid@v0.3.0
        with:
          config: docs/aphid.toml
          output: docs/dist

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` is what the stack tracks, so hoster's poller deploys the
      # docs even if the webhook below never arrives.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCS_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: docs
          push: true
          platforms: linux/amd64   # the VPS's architecture
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

      # A fresh, single-use OIDC token for hoster's audience, then the digest
      # to the deploy webhook. 202: deployment accepted; 200: already running
      # this digest. Anything else fails the job with hoster's reason.
      - name: Deploy to hoster
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          audience=$(jq -rn --arg a "$DEPLOY_AUDIENCE" '$a|@uri')
          token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$audience" | jq -r .value)
          echo "::add-mask::$token"

          body=$(jq -nc --arg s "$DOCS_STACK" --arg svc "$DOCS_SERVICE" --arg d "$DIGEST" \
            --arg t "$GITHUB_REF_NAME" '{stack:$s, images:{($svc):$d}, tag:$t}')
          status=$(curl -sS -o response.json -w '%{http_code}' -X POST "$DEPLOY_URL" \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $token" \
            --data "$body")
          echo "response ($status): $(cat response.json)"
          case "$status" in
            200|202) ;;
            *) echo "::error::hoster refused the deploy ($status): $(cat response.json)"; exit 1 ;;
          esac

  # Update the Homebrew tap (LHelge/homebrew-tap) cask to point at the
  # release just published: download the macOS dmg, compute its sha256,
  # regenerate Casks/granit.rb, and commit/push to the tap. A tap failure
  # must never fail the release, hence continue-on-error.
  bump-cask:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - name: Download release dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${{ github.ref_name }}" --repo ${{ github.repository }} --pattern '*_aarch64.dmg'

      - name: Compute sha256
        id: sha
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          SHA=$(sha256sum "Granit_${VERSION}_aarch64.dmg" | cut -d' ' -f1)
          {
            echo "version=$VERSION"
            echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Check out tap
        uses: actions/checkout@v6
        with:
          repository: LHelge/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: homebrew-tap

      - name: Regenerate cask
        env:
          VERSION: ${{ steps.sha.outputs.version }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          cat > homebrew-tap/Casks/granit.rb <<EOF
          cask "granit" do
            version "$VERSION"
            sha256 "$SHA"

            url "https://github.com/LHelge/granit/releases/download/v#{version}/Granit_#{version}_aarch64.dmg",
                verified: "github.com/LHelge/granit/"
            name "Granit"
            desc "Minimal desktop note-taking app"
            homepage "https://granit.lhelge.se/"

            depends_on arch: :arm64

            auto_updates true

            app "Granit.app"

            zap trash: [
              "~/Library/Application Support/se.lhelge.granit",
              "~/Library/Caches/se.lhelge.granit",
              "~/Library/Saved Application State/se.lhelge.granit.savedState",
              "~/Library/WebKit/se.lhelge.granit",
            ]
          end
          EOF

      - name: Commit and push
        working-directory: homebrew-tap
        env:
          VERSION: ${{ steps.sha.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/granit.rb
          git diff --cached --quiet || git commit -m "granit $VERSION"
          git push
