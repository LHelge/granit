name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  # The changelog must exist before the build: tauri-action bakes the
  # release body into the updater manifest (latest.json "notes"), which is
  # what the app shows as release notes after an automatic update.
  changelog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      body: ${{ steps.changelog.outputs.body }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Generate changelog
        id: changelog
        run: |
          git-cliff --latest --strip header -o CHANGELOG_RELEASE.md
          {
            echo 'body<<CHANGELOG_EOF'
            cat CHANGELOG_RELEASE.md
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

  # Publish the backup backend as a container image. Runs alongside the
  # desktop builds (both gate on the same CI check) but is independent of
  # them: a failed image push must not hold back the desktop release and
  # vice versa. The Dockerfile expects the repository root as build
  # context because granit-server depends on the granit-api path crate.
  backend-image:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v0.8.0 -> 0.8.0, 0.8, latest
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/lhelge/granit-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No attestation manifest: it shows up as a confusing extra
          # "unknown/unknown" entry on the GHCR package page.
          provenance: false

  # The Tauri app, for Windows and Linux until the GPUI app is packaged for
  # them too (Bears zem.nb). macOS is built by `build-macos` below.
  build:
    needs: [check, changelog]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    # Typically 16-22 min (Windows slowest); a hung build must not run to
    # the 6 h default.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      # Bounded for the same reason as in ci.yml: an unreachable Ubuntu
      # mirror stalls apt for a long time instead of failing.
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # The linuxdeploy build tauri pins predates the excludelist entries for
      # libwayland, so the AppImage ships Ubuntu's libwayland-* and the host
      # EGL stack dlopens them, aborting with EGL_BAD_PARAMETER on rolling
      # distros (Arch/Hyprland reproduced). tauri-bundler only downloads
      # linuxdeploy-plugin-gtk.sh when it is absent from its tool cache, so we
      # pre-seed a patched copy that strips libwayland from the AppDir before
      # packaging and signing. Drop this once tauri updates its linuxdeploy.
      - name: Patch AppImage gtk plugin to exclude libwayland
        if: matrix.platform == 'ubuntu-latest'
        run: |
          mkdir -p ~/.cache/tauri
          curl -fsSL https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh -o ~/.cache/tauri/linuxdeploy-plugin-gtk.sh
          cat >> ~/.cache/tauri/linuxdeploy-plugin-gtk.sh <<'PATCH'

          # granit patch: never ship libwayland — bundled copies break host EGL
          # display creation (EGL_BAD_PARAMETER) on hosts newer than the runner.
          echo "granit patch: removing bundled libwayland from AppDir"
          rm -f "$APPDIR"/usr/lib/libwayland-*.so*
          PATCH
          chmod +x ~/.cache/tauri/linuxdeploy-plugin-gtk.sh

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install trunk
        uses: taiki-e/install-action@trunk

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Granit v__VERSION__'
          releaseBody: ${{ needs.changelog.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # The macOS app is the GPUI one (granit-app), packaged by cargo-packager
  # from `[package.metadata.packager]` in granit-app/Cargo.toml: it builds
  # Granit.app, signs it with the Developer ID certificate (hardened
  # runtime) and makes and signs the dmg. With the updater key it also
  # writes Granit.app.tar.gz and its signature, the update archive the
  # Tauri updater of installed apps expects. The job then notarizes the dmg
  # itself, with a time limit.
  build-macos:
    needs: check
    runs-on: macos-latest
    # macOS minutes bill at 10x on private repos, so a hung build must not
    # run to the 6 h default.
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      TARGET: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install cargo-packager
        run: cargo install --locked cargo-packager@0.11.8

      - name: Read version
        id: version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "granit-app") | .version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # The deployment target matches `minimum-system-version` of the
      # packager config.
      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: cargo build --release -p granit-app --target "$TARGET"

      # cargo-packager imports the certificate into a keychain of its own
      # and removes it afterwards. It gets no notarization variables, so it
      # only signs (it warns that it skips notarization): its own
      # notarization waits for Apple without a limit. Without the updater
      # key it writes no update archive, which fails the upload step.
      - name: Package and sign
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo packager --release --target "$TARGET" -p granit-app --formats app,dmg

      # Notarizing the dmg covers the app inside it. Apple normally answers
      # within a few minutes, but can hold a submission for a review that
      # takes a day (it did for the first release), so the wait is limited
      # and the job fails instead of burning macOS minutes.
      - name: Notarize
        working-directory: target/${{ env.TARGET }}/release
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARIZE_TIMEOUT_SECONDS: 300
        run: |
          set -euo pipefail
          DMG=$(ls Granit_*_aarch64.dmg)
          auth=(--apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID")

          id=$(xcrun notarytool submit "$DMG" "${auth[@]}" --output-format json | jq -r .id)
          echo "Submitted $DMG to Apple's notary service: submission $id"

          deadline=$((SECONDS + NOTARIZE_TIMEOUT_SECONDS))
          while :; do
            # A failed status request counts as "not done yet".
            status=$(xcrun notarytool info "$id" "${auth[@]}" --output-format json | jq -r .status || true)
            echo "Status after ${SECONDS}s: ${status:-unknown}"
            case "$status" in
              Accepted) break ;;
              "In Progress" | "") ;;
              *)
                xcrun notarytool log "$id" "${auth[@]}" || true
                echo "::error title=Notarization rejected::Apple answered '$status' for submission $id. Its log is printed above."
                exit 1
                ;;
            esac
            if (( SECONDS >= deadline )); then
              echo "::error title=Notarization not finished::Apple has not notarized the app within ${NOTARIZE_TIMEOUT_SECONDS}s (submission $id is still in progress), so it is probably held for an in-depth review, which can take a day. Nothing was released. Check it on a Mac with 'xcrun notarytool info $id', and re-run this job once it is accepted: later submissions are usually quick."
              exit 1
            fi
            sleep 10
          done

          xcrun stapler staple "$DMG"

      - name: Verify signature and notarization
        working-directory: target/${{ env.TARGET }}/release
        run: |
          codesign --verify --deep --strict --verbose=2 Granit.app
          spctl --assess --type execute --verbose=2 Granit.app
          codesign --verify --verbose=2 Granit_*_aarch64.dmg
          xcrun stapler validate Granit_*_aarch64.dmg
          echo "Libraries the binary loads:"
          otool -L Granit.app/Contents/MacOS/granit-app
          du -sh Granit.app Granit.app/Contents/MacOS/granit-app Granit_*_aarch64.dmg

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: macos
          if-no-files-found: error
          retention-days: 3
          path: |
            target/${{ env.TARGET }}/release/Granit_*_aarch64.dmg
            target/${{ env.TARGET }}/release/Granit.app.tar.gz
            target/${{ env.TARGET }}/release/Granit.app.tar.gz.sig

  # Attach the macOS packages to the draft release that the Tauri build
  # created, and add macOS to its updater manifest (latest.json), which
  # tauri-action wrote for the platforms it built. The archive keeps the
  # asset name earlier releases used.
  release-macos:
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.build-macos.outputs.version }}
      ARCHIVE: Granit_aarch64.app.tar.gz

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: macos

      - name: Upload to the release
        run: |
          mv Granit.app.tar.gz "$ARCHIVE"
          mv Granit.app.tar.gz.sig "$ARCHIVE.sig"
          gh release upload "$TAG" Granit_*_aarch64.dmg "$ARCHIVE" "$ARCHIVE.sig" --clobber

      - name: Add macOS to the updater manifest
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern latest.json
          jq --arg signature "$(cat "$ARCHIVE.sig")" \
            --arg url "https://github.com/$GH_REPO/releases/download/$TAG/$ARCHIVE" \
            '.platforms["darwin-aarch64"] = {signature: $signature, url: $url}
             | .platforms["darwin-aarch64-app"] = .platforms["darwin-aarch64"]' \
            latest.json > latest.new.json
          mv latest.new.json latest.json
          jq '.platforms | keys' latest.json
          gh release upload "$TAG" latest.json --clobber

  # Un-draft the release; the body was already set from the changelog job.
  # The updater endpoint (releases/latest/download/latest.json) only
  # resolves for published releases, so this is what makes the update
  # visible to running apps. A pre-release tag (v1.2.3-rc.1) stops here,
  # with the draft left to inspect: nothing is published, and the docs and
  # the Homebrew cask, which need this job, are skipped with it.
  publish:
    needs: [build, release-macos]
    if: ${{ !(startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ github.ref_name }}" --draft=false

  # Build the docs site into an nginx image and deploy it to hoster
  # (stack file: docs/docs.stack.toml). The docs follow the released app, so
  # they go out only once the GitHub release is published. Authenticated
  # with the job's OIDC token, no secret: the stack's [deploy] rule allows
  # this repository's v* tags from the `production` environment.
  docs:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://granit.lhelge.se
    permissions:
      contents: read
      packages: write   # push to ghcr with GITHUB_TOKEN
      id-token: write   # request an OIDC token for hoster
    env:
      DOCS_IMAGE: ghcr.io/lhelge/granit-docs
      DOCS_STACK: granit
      DOCS_SERVICE: docs
      DEPLOY_URL: https://hoster.lhelge.se/hooks/deploy
      DEPLOY_AUDIENCE: https://hoster.lhelge.se

    steps:
      - uses: actions/checkout@v6

      - name: Build docs with aphid
        uses: LHelge/aphid@v0.3.0
        with:
          config: docs/aphid.toml
          output: docs/dist

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` is what the stack tracks, so hoster's poller deploys the
      # docs even if the webhook below never arrives.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCS_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: docs
          push: true
          platforms: linux/amd64   # the VPS's architecture
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

      # A fresh, single-use OIDC token for hoster's audience, then the digest
      # to the deploy webhook. 202: deployment accepted; 200: already running
      # this digest. Anything else fails the job with hoster's reason.
      - name: Deploy to hoster
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          audience=$(jq -rn --arg a "$DEPLOY_AUDIENCE" '$a|@uri')
          token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$audience" | jq -r .value)
          echo "::add-mask::$token"

          body=$(jq -nc --arg s "$DOCS_STACK" --arg svc "$DOCS_SERVICE" --arg d "$DIGEST" \
            --arg t "$GITHUB_REF_NAME" '{stack:$s, images:{($svc):$d}, tag:$t}')
          status=$(curl -sS -o response.json -w '%{http_code}' -X POST "$DEPLOY_URL" \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $token" \
            --data "$body")
          echo "response ($status): $(cat response.json)"
          case "$status" in
            200|202) ;;
            *) echo "::error::hoster refused the deploy ($status): $(cat response.json)"; exit 1 ;;
          esac

  # Update the Homebrew tap (LHelge/homebrew-tap) cask to point at the
  # release just published: download the macOS dmg, compute its sha256,
  # regenerate Casks/granit.rb, and commit/push to the tap. A tap failure
  # must never fail the release, hence continue-on-error.
  bump-cask:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - name: Download release dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${{ github.ref_name }}" --repo ${{ github.repository }} --pattern '*_aarch64.dmg'

      - name: Compute sha256
        id: sha
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          SHA=$(sha256sum "Granit_${VERSION}_aarch64.dmg" | cut -d' ' -f1)
          {
            echo "version=$VERSION"
            echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Check out tap
        uses: actions/checkout@v6
        with:
          repository: LHelge/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: homebrew-tap

      - name: Regenerate cask
        env:
          VERSION: ${{ steps.sha.outputs.version }}
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          cat > homebrew-tap/Casks/granit.rb <<EOF
          cask "granit" do
            version "$VERSION"
            sha256 "$SHA"

            url "https://github.com/LHelge/granit/releases/download/v#{version}/Granit_#{version}_aarch64.dmg",
                verified: "github.com/LHelge/granit/"
            name "Granit"
            desc "Minimal desktop note-taking app"
            homepage "https://granit.lhelge.se/"

            depends_on arch: :arm64

            auto_updates true

            app "Granit.app"

            zap trash: [
              "~/Library/Application Support/se.lhelge.granit",
              "~/Library/Caches/se.lhelge.granit",
              "~/Library/Saved Application State/se.lhelge.granit.savedState",
              "~/Library/WebKit/se.lhelge.granit",
            ]
          end
          EOF

      - name: Commit and push
        working-directory: homebrew-tap
        env:
          VERSION: ${{ steps.sha.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/granit.rb
          git diff --cached --quiet || git commit -m "granit $VERSION"
          git push
