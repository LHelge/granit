# nginx server for the docs site behind hoster. Replaces the image's default.conf.
server {
    listen 8080;
    listen [::]:8080;
    root /usr/share/nginx/html;

    # hoster terminates TLS and forwards with the Host header unchanged. Without this, nginx's
    # own redirects (`/wiki` -> `/wiki/`) would point at http://<host>:8080/wiki/.
    absolute_redirect off;

    # hoster's default health probe, answered without touching the disk.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml
               application/xml application/rss+xml application/atom+xml;
}
