[package]
name = "granit-app"
version.workspace = true
license.workspace = true
description = "Granit's native desktop app, built on GPUI"
authors = ["LHelge"]
edition = "2021"
publish = false

# The binary is `granit-app` until the cutover from the Tauri app, whose
# package already owns `granit`. The bundle id stays `se.lhelge.granit` and the
# product name `Granit` (see `host::APP_ID`).
[[bin]]
name = "granit-app"
path = "src/main.rs"

[dependencies]
# One gpui-pre for every GPUI crate: gpui-kit 0.10 pins =0.3.12.
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui-kit = { version = "0.10", features = [
    "tree-sitter-bash",
    "tree-sitter-javascript",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-toml",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
# The live-preview note editor. Patched to the fork with the stale-layout
# input fix in the workspace `Cargo.toml` until a release carries it.
zorite-editor = "0.11"
granit-core = { path = "../granit-core" }
granit-types = { path = "../granit-types" }
icondata_core = "0.1.0"
icondata_lu = "0.1.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.20"
dirs = "6"
log = "0.4"
env_logger = "0.11"
# HTML on the clipboard ("Copy note"), which GPUI's clipboard cannot hold.
# The same version and Wayland support as the Tauri clipboard plugin's.
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
gpui-kit = { version = "0.10", features = ["test-support"] }
tempfile = "3.27.0"

# Packaging with cargo-packager: `cargo packager --release -p granit-app`
# after a release build. The release workflow runs it for macOS (signed,
# notarized `Granit.app` and `Granit_<version>_aarch64.dmg`). The version
# comes from the workspace. Paths are relative to this directory; the icons
# and the model stay under `src-tauri/` until the cutover.
[package.metadata.packager]
product-name = "Granit"
identifier = "se.lhelge.granit"
category = "Productivity"
homepage = "https://granit.lhelge.se/"
icons = [
    "../src-tauri/icons/32x32.png",
    "../src-tauri/icons/128x128.png",
    "../src-tauri/icons/128x128@2x.png",
    "../src-tauri/icons/icon.icns",
    "../src-tauri/icons/icon.ico",
]
# The default embedding model, so RAG works without a download
# (`host::bundled_model_dir` finds it).
resources = [
    { src = "../src-tauri/resources/models/all-MiniLM-L6-v2-onnx/*", target = "models/all-MiniLM-L6-v2-onnx" },
]

# `signing-identity` is matched by codesign against the certificate's name,
# so this picks the one Developer ID certificate of the keychain that
# cargo-packager fills from `APPLE_CERTIFICATE`. Notarization uses
# `APPLE_ID`, `APPLE_PASSWORD` and `APPLE_TEAM_ID`. The app is not sandboxed
# and needs no entitlements.
[package.metadata.packager.macos]
minimum-system-version = "11.0"
signing-identity = "Developer ID Application"
