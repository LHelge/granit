[package]
name = "granit-core"
version.workspace = true
license.workspace = true
description = "Host-agnostic core of Granit: caves, markdown, the AI agent and backups"
authors = ["LHelge"]
edition = "2021"

# No Tauri dependency, directly or transitively: the desktop hosts (the Tauri
# app today, the GPUI app later) link this crate and add their own UI glue.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.20"
serde_yml = "0.0.13"
granit-types = { path = "../granit-types" }
granit-api = { path = "../granit-api" }
pulldown-cmark = "0.13.4"
chrono = { version = "0.4.45", features = ["serde"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
rig-core = "0.42.0"
rig-agent = "0.42.0"
futures = "0.3.34"
reqwest = { version = "0.13.4", features = ["json", "query"] }
html-to-markdown-rs = "3.11.4"
tera = "2.2.0"
log = "0.4"
fastembed = "6"
rkyv = { version = "0.8", features = ["alloc"] }
atomic-write-file = { version = "0.3", features = ["unnamed-tmpfile"] }
parking_lot = "0.12"
tar = "0.4"
zstd = "0.13"
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["serde"] }
percent-encoding = "2"

[dev-dependencies]
tempfile = "3.27.0"
